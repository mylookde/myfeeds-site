<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://wordpress.org/plugins/myfeeds-affiliate-feed-manager/">
<title>MyFeeds on WordPress.org</title>
<script>
/* Short link for emails: myfeeds.site/free. Gmail drafts rewrite links to
   wordpress.org into google.com redirects, links to this domain stay as they
   are. The hit is counted in GoatCounter (no cookie) before moving on. */
(function () {
  var target = 'https://wordpress.org/plugins/myfeeds-affiliate-feed-manager/';
  try { new Image().src = 'https://myfeeds.goatcounter.com/count?p=' + encodeURIComponent('/free/') + '&t=' + encodeURIComponent('Short link: free plugin') + '&r=' + encodeURIComponent(document.referrer) + '&rnd=' + Math.random().toString(36).slice(2); } catch (e) {}
  setTimeout(function () { location.replace(target); }, 250);
})();
</script>
<meta http-equiv="refresh" content="1; url=https://wordpress.org/plugins/myfeeds-affiliate-feed-manager/">
</head><body>
<p>On the way to <a href="https://wordpress.org/plugins/myfeeds-affiliate-feed-manager/">MyFeeds on WordPress.org</a>.</p>
</body></html>
